syntax = "proto3";

service ScreenAPI {
  rpc ad_list(ScreenAdListRequest) returns (ScreenAdListReply) {}
  rpc ad_play(ScreenAdPlayRequest) returns (ScreenAdPlayReply) {}
}

service ServerAPI {
  rpc ad_list(ServerAdListRequest) returns (ServerAdListReply) {}
  rpc ad_screens(ServerAdScreensRequest) returns (ServerAdScreensReply) {}
  rpc review_list(ServerReviewListRequest) returns (ServerReviewListReply) {}
}

enum MediaType {
  IMAGE = 0;
  VIDEO = 1;
}

message TagsMap {
  string key = 1;
  repeated string value = 2;
}

message Context {
  repeated TagsMap tags = 1;
}

message MediaList {
  string media_url = 1;
  string jump_url = 2;
  string md5 = 3;
  string filename = 4;
  MediaType media_type = 5;
  double duration = 6;
}

message ScreenAdvertisements {
  uint32 ad_id = 1;
  uint32 count = 2;
  string exp_ts = 3;
  repeated MediaList media_list = 4;
}

message ServerAdvertisements {
  uint32 ad_id = 1;
  string play_id = 2;
  uint32 device_count = 3;
  uint32 status = 4;
  uint64 update_ts = 5;
  string begin = 6;
  string end = 7;
  string expired = 8;
  repeated MediaList media_list = 9;
}

message ReviewAdvertisements {
  uint32 ad_id = 1;
  uint32 review_status = 2;
  uint64 update_ts = 3;
  uint64 review_ts = 4;
  string begin = 5;
  string end = 6;
  string expired = 7;
  repeated MediaList media_list = 8;
}

message Devices {
  string device_id = 1;
  uint32 count = 2;
}

message ScreenAdListRequest {
  uint32 channel_id = 1;
  string device_id = 2;
}

message ScreenAdListReply {
  repeated ScreenAdvertisements data = 1;
}

message ScreenAdPlayRequest {
  uint32 channel_id = 1;
  string device_id = 2;
  Context context = 3;
}

message ScreenAdPlayReply {
  uint32 ad_id = 1;
  string play_id = 2;
  double timeout = 3;
  uint32 count = 4;
  string exp_ts = 5;
  repeated MediaList media_list = 6;
}

message ServerAdListRequest {
  uint32 channel_id = 1;
  uint32 page = 2;
  uint32 page_size = 3;
}

message ServerAdListReply {
  uint32 total_page = 1;
  uint32 page = 2;
  uint32 total = 3;
  repeated ServerAdvertisements ad_list = 4;
}

message ServerAdScreensRequest {
  uint32 channel_id = 1;
  uint32 ad_id = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message ServerAdScreensReply {
  uint32 total_page = 1;
  uint32 page = 2;
  uint32 total = 3;
  repeated Devices device_list = 4;
}

message ServerReviewListRequest {
  uint32 channel_id = 1;
  uint32 review_status = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message ServerReviewListReply {
  uint32 total_page = 1;
  uint32 page = 2;
  uint32 total = 3;
  repeated ReviewAdvertisements ad_list = 4;
}